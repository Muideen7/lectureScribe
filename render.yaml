services:
  - type: web
    name: lecturescribe
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Signs the per-visitor owner cookie. Without it every request throws,
      # because there would be no way to keep saved lectures private.
      # Generate once with `openssl rand -hex 32` and never change it —
      # changing it orphans every lecture saved under the old value.
      - key: IDENTITY_SECRET
        sync: false
